name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install quality-test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pypdf python-dotenv

      - name: Lint
        run: ruff check .

      - name: Compile check
        run: python -m compileall -q bot.py config.py database.py handlers.py pdf_processor.py rag_engine.py tests

      - name: Tests
        run: pytest -q
